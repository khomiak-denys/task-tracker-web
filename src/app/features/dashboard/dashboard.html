<div class="dashboard-container">
  <header class="dashboard-header">
    <div class="header-left">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L2 7V10C2 16.5 6.84 22.74 12 24C17.16 22.74 22 16.5 22 10V7L12 2Z"
              fill="url(#dash-shield)" opacity="0.9"/>
        <path d="M9 12L11 14L15 10" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <defs>
          <linearGradient id="dash-shield" x1="2" y1="2" x2="22" y2="24">
            <stop stop-color="#0078D4"/>
            <stop offset="1" stop-color="#00BCF2"/>
          </linearGradient>
        </defs>
      </svg>
      <span class="header-title">Task Tracker</span>
    </div>
    <div class="header-right">
      <div class="user-menu-container">
        <button
          type="button"
          class="avatar-btn"
          (click)="toggleDropdown()"
          [class.active]="dropdownOpen()"
          aria-label="User account menu"
          aria-haspopup="true"
          [attr.aria-expanded]="dropdownOpen()"
          id="user-avatar-btn"
        >
          <span class="avatar-letter">{{ userInitial() }}</span>
        </button>

        @if (dropdownOpen()) {
          <div class="user-dropdown" role="menu" id="user-dropdown-menu">
            <div class="dropdown-items">
              <button
                type="button"
                class="dropdown-item"
                (click)="onProfile()"
                role="menuitem"
                id="menu-item-profile"
              >
                <svg class="dropdown-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span>Profile</span>
              </button>

              <button
                type="button"
                class="dropdown-item dropdown-item-danger"
                (click)="onLogout()"
                role="menuitem"
                id="menu-item-logout"
              >
                <svg class="dropdown-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                  <polyline points="16 17 21 12 16 7"></polyline>
                  <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                <span>Sign out</span>
              </button>
            </div>
          </div>
        }
      </div>
    </div>
  </header>

  <main class="dashboard-main">
    <div class="welcome-card">
      <h1>Dashboard</h1>
      <p>Authentication successful. This is a placeholder page -- task management UI will be built here.</p>
    </div>
  </main>
</div>
